[book]
title = "The Rock Programming Language"
authors = ["The Rock Project Contributors"]
description = "A practical, beginner-friendly guide to the Rock programming language"
language = "en"
src = "src"

[build]
build-dir = "book"
create-missing = false
extra-watch-dirs = [".deps/tree-sitter-rock/queries"]

[preprocessor.rock-highlight]
command = "node checks/rock-highlight.cjs"
renderers = ["html"]

[output.html]
default-theme = "ayu"
preferred-dark-theme = "ayu"
git-repository-url = "https://github.com/Rock-lang-org/Rock"
edit-url-template = "https://github.com/Rock-lang-org/Rock/edit/develop/docs/{path}"
site-url = "/Rock/"
additional-css = ["theme/rock.css"]

[output.html.fold]
enable = true
level = 1

[output.html.search]
enable = true
limit-results = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 3
