name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (vMAJOR.MINOR.PATCH)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Install LLVM 18 static build dependencies
        run: sudo apt-get update && sudo apt-get install -y llvm-18-dev libpolly-18-dev libzstd-dev libxml2-dev zlib1g-dev libffi-dev libedit-dev libncurses-dev build-essential
      - name: Test and package
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          LLVM_SYS_180_PREFIX: /usr/lib/llvm-18
        run: |
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
          test -s "docs/release-notes/$RELEASE_TAG.md"
          cargo test --locked -p rock-shared --all-features
          cargo test --locked -p rockup
          sh scripts/tests/install.sh
          bash scripts/release.sh "$RELEASE_TAG"
          bash scripts/tests/release.sh "dist/$RELEASE_TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/${{ inputs.tag || github.ref_name }}/*
          if-no-files-found: error

  runtime:
    needs: package
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    steps:
      - name: Install end-user prerequisites only
        run: apt-get update && apt-get install -y --no-install-recommends build-essential curl ca-certificates
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist/${{ inputs.tag || github.ref_name }}
      - name: Install and compile without LLVM
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          test -z "$(find /usr/lib -name 'libLLVM*.so*' -print -quit)"
          ! command -v llvm-config
          bash scripts/tests/release.sh "dist/$RELEASE_TAG"

  draft:
    needs: runtime
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          # The checkout's assets/ directory contains source images, not release files.
          path: dist/release-assets
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/release-assets/* --repo "$GH_REPO" --verify-tag --draft \
            --title "Rock $RELEASE_TAG" --notes-file "docs/release-notes/$RELEASE_TAG.md"
