name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (vMAJOR.MINOR.PATCH)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Install LLVM 18 static build dependencies
        run: sudo apt-get update && sudo apt-get install -y llvm-18-dev libpolly-18-dev libzstd-dev libxml2-dev zlib1g-dev libffi-dev libedit-dev libncurses-dev build-essential
      - name: Test and package
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          LLVM_SYS_180_PREFIX: /usr/lib/llvm-18
        run: |
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
          test -s "docs/release-notes/$RELEASE_TAG.md"
          # CLI tests launch the standalone binaries from the Cargo target directory.
          cargo build --locked --workspace --release --all-features
          target/release/rockup dev std package --path "$PWD/std" --sysroot "$PWD/target" --copy-source --rockc "$PWD/target/release/rockc"
          cargo test --locked --workspace --release --all-features
          sh scripts/tests/install.sh
          bash scripts/release.sh "$RELEASE_TAG"
          bash scripts/tests/release.sh "dist/$RELEASE_TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/${{ inputs.tag || github.ref_name }}/*
          if-no-files-found: error

  # Builds the toolchain natively on macOS and Windows, runs the std platform
  # smoke program and the full test suite there. Linux is covered by `package`.
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            triple: aarch64-apple-darwin
          - os: windows-2022
            triple: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable

      - name: Install LLVM 18 (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm@18 zstd
          echo "LLVM_SYS_180_PREFIX=$(brew --prefix llvm@18)" >> "$GITHUB_ENV"
          # Static LLVM archives link against Homebrew's zstd and friends.
          echo "LIBRARY_PATH=$(brew --prefix)/lib" >> "$GITHUB_ENV"

      - name: Install LLVM 18 (Windows)
        if: runner.os == 'Windows'
        run: |
          # Official LLVM release: llvm-config, static libraries and every
          # backend, so cross-target tests (AArch64 Darwin) run here too.
          curl -fsSL -o llvm.tar.xz https://github.com/llvm/llvm-project/releases/download/llvmorg-18.1.8/clang+llvm-18.1.8-x86_64-pc-windows-msvc.tar.xz
          # GNU tar reads "D:" as a remote host: give it a POSIX path.
          llvm="$(cygpath -u "$RUNNER_TEMP")/llvm"
          mkdir -p "$llvm"
          tar -xJf llvm.tar.xz -C "$llvm" --strip-components=1
          test -x "$llvm/bin/llvm-config.exe"
          echo "LLVM_SYS_180_PREFIX=$(cd "$llvm" && pwd -W)" >> "$GITHUB_ENV"
          # llvm-config lists a static libxml2 as a system library. vcpkg's
          # static build against the dynamic CRT matches Rust's default CRT.
          "$VCPKG_INSTALLATION_ROOT/vcpkg" install libxml2:x64-windows-static-md
          libs="$(cygpath -u "$VCPKG_INSTALLATION_ROOT")/installed/x64-windows-static-md/lib"
          cp "$libs/libxml2.lib" "$llvm/lib/libxml2s.lib"

      # Puts MSVC's link.exe and the CRT/SDK libraries on PATH and LIB for
      # rockc's linker invocation.
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      # Git Bash puts coreutils' link.exe (hard links) ahead of MSVC's linker,
      # which breaks both Cargo and rockc's link step.
      - name: Remove Git's link.exe
        if: runner.os == 'Windows'
        run: rm -f /usr/bin/link.exe && which link.exe

      - name: Build toolchain
        run: cargo build --locked --release -p rock -p rockc -p rockup

      - name: Report target
        run: |
          target/release/rockc --print target-triple
          target/release/rockc --print cfg
          test "$(target/release/rockc --print target-triple)" = "${{ matrix.triple }}"

      - name: Package std
        run: target/release/rockup dev std package --path "$PWD/std" --sysroot "$PWD/target" --copy-source --rockc "$PWD/target/release/rockc"

      - name: Platform smoke
        run: |
          work="$RUNNER_TEMP/platform_smoke"
          rm -rf "$work"
          cp -R lib/tests/fixtures/platform_smoke "$work"
          cd "$work"
          "$GITHUB_WORKSPACE/target/release/rock" run --release -- café-ü

      - name: Full test suite
        run: cargo test --locked --workspace --release --no-fail-fast

  runtime:
    needs: package
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    steps:
      - name: Install end-user prerequisites only
        run: apt-get update && apt-get install -y --no-install-recommends build-essential curl ca-certificates
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist/${{ inputs.tag || github.ref_name }}
      - name: Install and compile without LLVM
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          test -z "$(find /usr/lib -name 'libLLVM*.so*' -print -quit)"
          ! command -v llvm-config
          bash scripts/tests/release.sh "dist/$RELEASE_TAG"

  draft:
    needs: [runtime, native]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          # The checkout's assets/ directory contains source images, not release files.
          path: dist/release-assets
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/release-assets/* --repo "$GH_REPO" --verify-tag --draft \
            --title "Rock $RELEASE_TAG" --notes-file "docs/release-notes/$RELEASE_TAG.md"
